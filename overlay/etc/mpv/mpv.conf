# Hardware decoding through the Cedrus VPU — see docs/video-decode.md.
#
# `v4l2request` and `v4l2request-copy` exist because the image's FFmpeg
# (build/04c-v4l2-ffmpeg.sh) registers the `v4l2request` hwdevice plus the
# per-codec V4L2 request-API hwaccels. mpv derives its --hwdec values straight
# from FFmpeg's per-codec hw configs, so no mpv patch is involved.
#
# Take the copy variant. The zero-copy variant (`--hwdec=v4l2request`) yields
# dmabuf frames, but mpv has no render-API interop for
# AV_HWDEVICE_TYPE_V4L2REQUEST and `--vo=dmabuf-wayland` refuses those frames,
# so it silently falls back to software. That software path is the one that
# segfaults inside Mesa's panfrost driver here (see docs/video-decode.md), so
# the copy variant is also the stable one: measured 2026-10-17, normal
# playback of 12 s of 540p HEVC, crashes per 5 runs —
#   software + vo=gpu       3   (vo=gpu-next: 5)
#   v4l2request-copy        0   (25 runs total)
#
# The copy costs throughput (~45 fps at 540p, ~15 fps at 1080p on this device),
# so 1080p plays below real time. Moonlight is unaffected: it uses its own
# zero-copy FFmpeg.
#
# mpv falls back to software automatically if the VPU is unavailable
# (--hwdec-software-fallback defaults to yes).
hwdec=v4l2request-copy
vo=gpu
