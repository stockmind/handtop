# Hardware decoding through the Cedrus VPU — see docs/video-decode.md.
#
# The image's FFmpeg (build/04c-v4l2-ffmpeg.sh plus
# build/patches/ffmpeg-v4l2request-drm.patch) registers the stateless V4L2
# request-API decoders under the `v4l2request` hwdevice and, since 2026-10-17,
# under `drm` as well. The `drm` registration is what makes mpv's DRM PRIME
# interop usable, so zero-copy works with an unpatched mpv:
#
#   --hwdec=drm               zero-copy: the decoder's dmabufs go straight to
#                             the VO's DRM PRIME interop
#   --hwdec=drm-copy          each frame is downloaded to memory instead
#
# auto-safe takes the first of those that works, so it lands on zero-copy and
# keeps the copy variant behind it; if a codec is unsupported or the VO has no
# usable interop it falls back on its own. Software decoding is the last
# resort, and it is the one that segfaults intermittently inside Mesa's
# panfrost driver on this device (3/5 normal-playback runs, reproduced with
# Debian's stock libavcodec, so it predates this image), which is why hardware
# decoding is preferred so strongly here.
hwdec=auto-safe

# mpv only tries hardware for the codecs on its whitelist, which by default
# leaves MPEG-2 and VP8 on the CPU even though Cedrus decodes both ("[vd] Not
# trying to use hardware decoding: codec mpeg2video is not on whitelist", with
# any --hwdec spelling). This option *replaces* that list, so the codecs that
# matter have to be in it.
#
# VP9 and AV1 are deliberately absent: this kernel's Cedrus has no decoder for
# them, and mpv's attempt at them fails on every frame instead of falling back
# cleanly ("Error while decoding frame (hardware decoding)!"). Leaving them out
# means they decode in software right away, with no errors.
#
# Measured 2026-10-21, 120 frames, vo=gpu --profile=fast: MPEG-2 1080i 88.8 ->
# 45.6 % CPU, VP8 720p 92.1 -> 48.1 %, same fps in both cases — the win is
# battery and thermal headroom, not frame rate.
# vp9 was added 2026-10-29, when cedrus gained a VP9 backend (out-of-tree
# series, see docs/video-decode.md): 1080p24 zero-copy playback costs 48 % of
# one core against 116 % in software, and the output is bit-identical.
hwdec-codecs=h264,hevc,mpeg2video,vp8,vp9

# The default (high-quality) scaler cannot keep up with 1080p on this SoC: 23 fps
# on the gpu VO, i.e. dropped frames at 24 fps, where a bilinear scaler reaches
# 51 fps with 0 dropped frames over 10 s (and 43 fps at 1080p H.264). On a
# 640x480 panel the difference is not visible.
profile=fast

# dmabuf-wayland hands the decoder's dmabufs to the compositor, so neither mpv
# nor Mali has to scale or convert the picture; gpu renders it through
# libplacebo and costs about twice as much. Measured on paced 1080p24 VP9
# playback (2026-10-29, 30 s per run, whole-mpv CPU): 11 % of one core on
# dmabuf-wayland against 21 % on gpu, with software decoding at 107 %. 6.1 ms
# against 8.5 ms per frame in a throughput run. Subtitles and OSD were verified
# to render on dmabuf-wayland on this image.
#
# It is first, but not unconditionally: it only takes dmabuf frames, and mpv
# falls back to the next VO in the list only when a VO fails to *initialise*.
# dmabuf-wayland initialises fine and then rejects the frames of anything
# decoded in software (AV1, and any codec off the whitelist above):
#
#   [hwupload] upload yuv420p -> drm_prime[yuv420p]
#   [hwupload] failed to upload frame
#   [cplayer] Could not initialize video chain.
#   [cplayer] Video: no video
#
# with the audio track carrying on, so the file looks like it has no picture at
# all. scripts/vo-by-codec.lua therefore sets the VO from the file's video
# codec: this list for the codecs above, plain `gpu` for everything else (gpu
# takes both software and dmabuf frames).
#
# Zero-copy works for every picture width: the Cedrus driver gives the
# decoded picture a 64-byte aligned stride, which is what panfrost needs to
# import the dmabuf (see docs/video-decode.md, "The blue video").
vo=dmabuf-wayland,gpu
