# Software decoding by default.
#
# The Cedrus VPU is reachable from the system FFmpeg only through the mainline
# V4L2 request-API hwaccel ("--hwdec=drm"), and that path is broken on this
# kernel/Cedrus combination: it segfaults inside libavcodec's HEVC decoder
# (verified 2026-10-17, see docs/video-decode.md). Defaulting to it made mpv
# crash on every HEVC file. Moonlight is unaffected: it links its own FFmpeg
# with the older `*_v4l2request` decoders.
#
# Opt in manually while experimenting:
#   mpv --hwdec=drm --vo=gpu <file>
hwdec=no
vo=gpu
