# Key bindings for the handheld media client (goblin).
#
# mpv's built-in Esc binding is "cycle pause"; on the handheld B (Esc) is the
# "close the video and go back to the library" key, so it quits instead. The
# rest of the defaults stay (this file is read in addition to them, not
# instead of them: --input-default-bindings is on by default).
esc quit
q quit
