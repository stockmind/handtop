# Key bindings for the handheld media client (goblin).
#
# This file is read in addition to mpv's own bindings, not instead of them
# (--input-default-bindings is on by default), so it only says what the
# handheld needs to differ on.
#
# B (Esc) closes the video and drops back into the library. mpv's built-in
# Esc binding is "cycle pause", so it is rebound here.
esc quit
q quit

# The rest of the keypad, while a video plays:
#   D-pad left/right  seek 15 s
#   D-pad up/down    volume (mpv's default)
#   Y (Space)        pause
#   X (Tab)          switch the subtitle track
#   B (Esc)          back to the library
LEFT seek 15
RIGHT seek 15
SPACE cycle pause
TAB cycle sub
